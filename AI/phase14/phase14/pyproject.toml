[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karigarSaathi-phase14"
version = "0.1.0"
description = "Phase 14: Voice and Multilingual Auto-Catalogue for KarigarSaathi AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "faster-whisper>=1.2.0",
    "ffmpeg-python>=0.2.0",
    "python-multipart>=0.0.6",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 88
tree-max-depth = 20

[tool.pytest]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx[extra]>=0.27.0",
    "pytest-cov>=5.0.0",
]