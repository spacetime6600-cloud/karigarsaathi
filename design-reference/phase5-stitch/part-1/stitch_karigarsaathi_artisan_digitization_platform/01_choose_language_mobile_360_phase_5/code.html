<!DOCTYPE html><html class="light" lang="en"><head>

<style>
        body {
            background-color: #FFF9EF; /* Level 0 Background */
        }
        
        /* Focus state accessibility */
        *:focus-visible {
            outline: 2px solid #cc8c28; /* Marigold highlight */
            outline-offset: 2px;
        }

        .lang-card {
            transition: all 0.2s ease;
        }
        
        .lang-card[aria-selected="true"] {
            border: 2px solid #a13f1c; /* Terracotta secondary */
            background-color: #F3E8D5; /* Level 2 */
            box-shadow: 0 4px 16px rgba(0, 29, 54, 0.1); /* Primary color shadow */
        }
        
        .lang-card[aria-selected="false"] {
            border: 1.5px solid #d1dbe9; /* Surface dim */
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 29, 54, 0.06);
        }
        
        .lang-card[aria-selected="true"] .checkmark {
            opacity: 1;
            transform: scale(1);
        }
        
        .lang-card[aria-selected="false"] .checkmark {
            opacity: 0;
            transform: scale(0.8);
        }

        /* Prevent clipping at 200% scaling */
        .native-text {
            line-height: 1.2;
            word-break: keep-all;
        }
    </style>
</head>
<body class="font-body-md text-on-background min-h-screen flex flex-col max-w-[360px] mx-auto overflow-x-hidden relative">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim shadow-sm z-50 flex flex-col px-margin-mobile h-touch-target-min w-full">
<div class="flex justify-between items-center w-full h-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim">
                KarigarSaathi
            </h1>
<button aria-label="Listen to page text" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high transition-colors active:scale-95 duration-150 rounded-full shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">volume_up</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow px-margin-mobile py-lg pb-32 flex flex-col gap-md">
<div class="mb-sm">
<h2 class="font-title-md text-title-md text-on-surface mb-xs">Choose Language</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Select the language you are most comfortable with.</p>
</div>
<!-- Language Cards Stack -->
<div aria-label="Select language" class="flex flex-col gap-sm" role="radiogroup">
<!-- English -->
<button aria-checked="false" aria-selected="false" class="lang-card w-full text-left p-md rounded-xl flex items-center justify-between min-h-touch-target-min cursor-pointer" onclick="selectLang(this)" role="radio">
<div class="flex flex-col gap-xs pr-sm">
<span class="font-title-md text-title-md text-on-surface native-text">English</span>
</div>
<div class="checkmark w-6 h-6 rounded-full flex items-center justify-center shrink-0 transition-all duration-200 opacity-0 scale-80 bg-primary-container">
<span class="material-symbols-outlined text-on-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Hindi -->
<button aria-checked="false" aria-selected="false" class="lang-card w-full text-left p-md rounded-xl flex items-center justify-between min-h-touch-target-min cursor-pointer" onclick="selectLang(this)" role="radio">
<div class="flex flex-col gap-xs pr-sm">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface native-text mb-1">हिन्दी</span>
<span class="font-label-lg text-label-lg text-on-surface-variant">Hindi</span>
</div>
<div class="checkmark w-6 h-6 rounded-full flex items-center justify-center shrink-0 transition-all duration-200 opacity-0 scale-80 bg-primary-container">
<span class="material-symbols-outlined text-on-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Odia -->
<button aria-checked="false" aria-selected="false" class="lang-card w-full text-left p-md rounded-xl flex items-center justify-between min-h-touch-target-min cursor-pointer" onclick="selectLang(this)" role="radio">
<div class="flex flex-col gap-xs pr-sm">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface native-text mb-1">ଓଡ଼ିଆ</span>
<span class="font-label-lg text-label-lg text-on-surface-variant">Odia</span>
</div>
<div class="checkmark w-6 h-6 rounded-full flex items-center justify-center shrink-0 transition-all duration-200 opacity-0 scale-80 bg-primary-container">
<span class="material-symbols-outlined text-on-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Bengali -->
<button aria-checked="false" aria-selected="false" class="lang-card w-full text-left p-md rounded-xl flex items-center justify-between min-h-touch-target-min cursor-pointer" onclick="selectLang(this)" role="radio">
<div class="flex flex-col gap-xs pr-sm">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface native-text mb-1">বাংলা</span>
<span class="font-label-lg text-label-lg text-on-surface-variant">Bengali</span>
</div>
<div class="checkmark w-6 h-6 rounded-full flex items-center justify-center shrink-0 transition-all duration-200 opacity-0 scale-80 bg-primary-container">
<span class="material-symbols-outlined text-on-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Telugu -->
<button aria-checked="false" aria-selected="false" class="lang-card w-full text-left p-md rounded-xl flex items-center justify-between min-h-touch-target-min cursor-pointer" onclick="selectLang(this)" role="radio">
<div class="flex flex-col gap-xs pr-sm">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface native-text mb-1">తెలుగు</span>
<span class="font-label-lg text-label-lg text-on-surface-variant">Telugu</span>
</div>
<div class="checkmark w-6 h-6 rounded-full flex items-center justify-center shrink-0 transition-all duration-200 opacity-0 scale-80 bg-primary-container">
<span class="material-symbols-outlined text-on-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 right-0 bg-[#FFF9EF] px-margin-mobile pb-lg pt-sm max-w-[360px] mx-auto z-40 before:content-[''] before:absolute before:-top-6 before:left-0 before:right-0 before:h-6 before:bg-gradient-to-t before:from-[#FFF9EF] before:to-transparent">
<!-- Provisional Notice -->
<p class="font-label-sm text-label-sm text-center text-on-surface-variant mb-sm">
            Provisional translations — human review required.
        </p>
<!-- Continue Button -->
<button class="w-full h-touch-target-min bg-primary-container text-on-secondary font-title-md text-title-md rounded-xl disabled:opacity-50 disabled:bg-surface-variant disabled:text-on-surface-variant transition-colors flex items-center justify-center" disabled="" id="continueBtn">Continue</button>
<!-- Footer Footer (from JSON) -->
<footer class="w-full mt-sm flex flex-col items-center gap-xs w-full">
<p class="font-label-sm text-label-sm text-center text-on-surface-variant dark:text-outline font-semibold">
                © 2024 KarigarSaathi. Translations are provisional.
             </p>
<div class="flex gap-md font-label-sm text-label-sm text-center">
<a class="text-on-surface-variant hover:text-primary transition-opacity duration-200" href="#">Terms</a>
<a class="text-on-surface-variant hover:text-primary transition-opacity duration-200" href="#">Privacy</a>
</div>
</footer>
</div>
<script>
        function selectLang(selectedEl) {
            // Reset all
            const cards = document.querySelectorAll('.lang-card');
            cards.forEach(card => {
                card.setAttribute('aria-selected', 'false');
                card.setAttribute('aria-checked', 'false');
            });

            // Set active
            selectedEl.setAttribute('aria-selected', 'true');
            selectedEl.setAttribute('aria-checked', 'true');

            // Enable continue button
            const btn = document.getElementById('continueBtn');
            btn.removeAttribute('disabled');
        }
    </script>


</body></html>
