<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>KarigarSaathi - Review and Choose Price</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#dfe9f7",
                        "primary-container": "#17324d",
                        "primary-fixed-dim": "#afc9ea",
                        "on-background": "#121c26",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c3c6ce",
                        "secondary": "#a13f1c",
                        "inverse-surface": "#27313c",
                        "surface-tint": "#47607e",
                        "inverse-on-surface": "#e8f2ff",
                        "secondary-fixed": "#ffdbd0",
                        "on-primary-fixed-variant": "#2f4865",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f7f9ff",
                        "inverse-primary": "#afc9ea",
                        "secondary-fixed-dim": "#ffb59d",
                        "on-tertiary": "#ffffff",
                        "outline": "#74777e",
                        "on-tertiary-fixed": "#2a1800",
                        "surface": "#f7f9ff",
                        "surface-container": "#e4effd",
                        "on-surface-variant": "#43474d",
                        "surface-dim": "#d1dbe9",
                        "secondary-container": "#fd835b",
                        "on-surface": "#121c26",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffddb5",
                        "on-primary-fixed": "#001d36",
                        "surface-variant": "#d9e3f1",
                        "on-secondary-fixed": "#390b00",
                        "on-primary-container": "#819aba",
                        "on-tertiary-fixed-variant": "#633f00",
                        "on-secondary-container": "#701f00",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#d1e4ff",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#ffb955",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#d9e3f1",
                        "surface-container-low": "#edf4ff",
                        "on-secondary-fixed-variant": "#812805",
                        "on-tertiary-container": "#cc8c28",
                        "primary": "#001d36",
                        "tertiary-container": "#462b00",
                        "tertiary": "#2a1800",
                        "background": "#f7f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "xs": "4px",
                        "md": "16px",
                        "base": "8px",
                        "touch-target-min": "48px",
                        "lg": "24px",
                        "sm": "8px",
                        "margin-desktop": "48px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Noto Sans"],
                        "label-lg": ["Noto Sans"],
                        "display-lg": ["Noto Sans"],
                        "body-md": ["Noto Sans"],
                        "title-md": ["Noto Sans"],
                        "body-lg": ["Noto Sans"],
                        "headline-lg": ["Noto Sans"],
                        "label-sm": ["Noto Sans"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]

                }
            }
        }
    </script>
<style>
        body { background-color: #f7f9ff; }
        .min-touch-target { min-height: 48px; min-width: 48px; }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopNavBar (JSON implementation for mobile) -->
<header class="bg-surface dark:bg-surface border-b-2 border-primary dark:border-outline flex justify-between items-center w-full px-margin-mobile h-[64px] shrink-0 sticky top-0 z-50">
<button aria-label="Back" class="min-touch-target flex items-center justify-center text-secondary hover:bg-surface-container-highest rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-on-surface">KarigarSaathi</h1>
<div class="flex items-center gap-xs">
<!-- Not showing language here based on user prompt strictly asking for listen/audio icon in top bar -->
<button aria-label="Listen" class="min-touch-target flex items-center justify-center text-secondary hover:bg-surface-container-highest rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
</button>
</div>
</header>
<main class="flex-1 px-margin-mobile py-lg overflow-y-auto pb-[120px]">
<!-- Step Indicator -->
<div class="mb-sm">
<p class="font-label-sm text-label-sm text-primary font-bold uppercase tracking-wider">Step 7 of 12</p>
</div>
<!-- Title -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-lg">Review and Choose Price</h2>
<!-- Cost Breakdown Section -->
<section class="mb-xl bg-surface-container-lowest rounded-xl p-md shadow-[0_2px_8px_rgba(0,29,54,0.06)] border border-surface-container-high">
<h3 class="font-title-md text-title-md text-on-surface mb-md">Cost Breakdown</h3>
<div class="space-y-md">
<!-- Material Input -->
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface-variant mb-xs" for="material-cost">Material</label>
<div class="relative flex items-center">
<span class="absolute left-md font-body-md text-on-surface-variant">₹</span>
<input class="w-full min-touch-target pl-[32px] pr-md py-sm bg-surface-container-lowest border-2 border-outline-variant rounded-lg font-body-md text-on-surface focus:border-primary focus:ring-0 transition-colors" id="material-cost" type="number" value="1500">
</div>
</div>
<!-- Labor Input -->
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface-variant mb-xs" for="labor-cost">Labor</label>
<div class="relative flex items-center">
<span class="absolute left-md font-body-md text-on-surface-variant">₹</span>
<input class="w-full min-touch-target pl-[32px] pr-md py-sm bg-surface-container-lowest border-2 border-outline-variant rounded-lg font-body-md text-on-surface focus:border-primary focus:ring-0 transition-colors" id="labor-cost" type="number" value="800">
</div>
</div>
<!-- Overhead Input -->
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface-variant mb-xs" for="overhead-cost">Overhead</label>
<div class="relative flex items-center">
<span class="absolute left-md font-body-md text-on-surface-variant">₹</span>
<input class="w-full min-touch-target pl-[32px] pr-md py-sm bg-surface-container-lowest border-2 border-outline-variant rounded-lg font-body-md text-on-surface focus:border-primary focus:ring-0 transition-colors" id="overhead-cost" type="number" value="200">
</div>
</div>
<div class="pt-sm border-t border-outline-variant flex justify-between items-center mt-sm">
<span class="font-label-lg text-label-lg text-on-surface-variant">Total Cost</span>
<span class="font-title-md text-title-md text-primary">₹ 2,500</span>
</div>
</div>
</section>
<!-- Pricing Suggestions Section -->
<section class="mb-xl">
<h3 class="font-title-md text-title-md text-on-surface mb-md">Market Suggestions</h3>
<div class="space-y-md">
<!-- Low Price Card -->
<button class="w-full text-left bg-surface-container-lowest rounded-xl p-md border-2 border-outline-variant hover:border-primary transition-colors focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none flex justify-between items-center min-touch-target">
<div>
<span class="font-label-lg text-label-lg text-secondary block mb-xs">Low (Quick Sale)</span>
<span class="font-body-md text-body-md text-on-surface-variant block">Minimal profit margin</span>
</div>
<span class="font-title-md text-title-md text-primary">₹ 2,800</span>
</button>
<!-- Base Price Card (Recommended/Selected styling) -->
<button class="w-full text-left bg-surface-container-lowest rounded-xl p-md border-2 border-primary bg-primary-fixed-dim/10 shadow-[0_4px_16px_rgba(0,29,54,0.1)] transition-colors focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none flex justify-between items-center min-touch-target relative overflow-hidden">
<!-- Subtle background pattern for active state -->
<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(#001d36 1px, transparent 1px); background-size: 8px 8px;"></div>
<div class="relative z-10">
<span class="font-label-lg text-label-lg text-primary block mb-xs flex items-center gap-xs">
                            Base <span class="material-symbols-outlined text-[16px]" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span> Recommended
                        </span>
<span class="font-body-md text-body-md text-on-surface-variant block">Standard market rate</span>
</div>
<span class="font-title-md text-title-md text-primary relative z-10">₹ 3,200</span>
</button>
<!-- High Price Card -->
<button class="w-full text-left bg-surface-container-lowest rounded-xl p-md border-2 border-outline-variant hover:border-primary transition-colors focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none flex justify-between items-center min-touch-target">
<div>
<span class="font-label-lg text-label-lg text-on-surface block mb-xs">High (Premium)</span>
<span class="font-body-md text-body-md text-on-surface-variant block">Higher profit, longer wait</span>
</div>
<span class="font-title-md text-title-md text-primary">₹ 4,000</span>
</button>
</div>
</section>
<!-- Final Price Entry Section -->
<section class="mb-lg rounded-xl p-md border border-error-container bg-error-container">
<h3 class="font-title-md text-title-md text-on-surface mb-sm">Your Final Price</h3>
<div class="flex flex-col">
<div class="relative flex items-center">
<span class="absolute left-md font-title-md text-primary">₹</span>
<input class="w-full min-touch-target pl-[32px] pr-md py-md bg-surface-container-lowest border-2 border-error rounded-lg font-headline-lg-mobile text-headline-lg-mobile text-error focus:border-error focus:ring-0 transition-colors" id="final-price" type="number" value="2400">
</div>
<!-- Warning Message -->
<div class="flex items-start gap-xs mt-sm text-error"><span class="material-symbols-outlined text-[20px] shrink-0 mt-xs text-on-error-container" data-icon="warning">warning</span><p class="font-label-sm text-label-sm text-on-error-container">Warning: This price (₹ 2,400) is below your calculated cost (₹ 2,500). You may lose money on this item.</p></div>
</div>
</section>
</main>
<!-- Bottom Action Area (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t-2 border-surface-variant p-margin-mobile flex flex-col gap-sm z-40 pb-[calc(16px+env(safe-area-inset-bottom))] shadow-[0_-4px_16px_rgba(0,29,54,0.05)]">
<button class="w-full h-[48px] bg-primary text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center transition-transform active:scale-[0.98] shadow-sm">Choose Price</button>
<button class="w-full h-[48px] bg-transparent text-primary font-label-lg text-label-lg border-2 border-transparent hover:bg-surface-container-highest rounded-full flex items-center justify-center transition-colors">Continue as Draft</button>
</div>


</body></html>
