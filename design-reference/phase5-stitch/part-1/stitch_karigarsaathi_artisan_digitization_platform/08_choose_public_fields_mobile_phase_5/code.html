<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>KarigarSaathi - Choose Public Info</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary": "#2a1800",
                        "on-surface-variant": "#43474d",
                        "on-primary-fixed-variant": "#2f4865",
                        "on-surface": "#121c26",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-tint": "#47607e",
                        "inverse-primary": "#afc9ea",
                        "on-secondary-container": "#701f00",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#dfe9f7",
                        "outline-variant": "#c3c6ce",
                        "primary": "#001d36",
                        "primary-container": "#17324d",
                        "surface-container-highest": "#d9e3f1",
                        "tertiary-container": "#462b00",
                        "on-tertiary-container": "#cc8c28",
                        "surface-variant": "#d9e3f1",
                        "secondary": "#a13f1c",
                        "secondary-container": "#fd835b",
                        "on-secondary-fixed-variant": "#812805",
                        "surface-container-low": "#edf4ff",
                        "on-primary-container": "#819aba",
                        "inverse-surface": "#27313c",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#ffb955",
                        "primary-fixed-dim": "#afc9ea",
                        "surface-container": "#e4effd",
                        "tertiary-fixed": "#ffddb5",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-dim": "#d1dbe9",
                        "secondary-fixed": "#ffdbd0",
                        "on-background": "#121c26",
                        "surface": "#f7f9ff",
                        "background": "#f7f9ff",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#633f00",
                        "primary-fixed": "#d1e4ff",
                        "secondary-fixed-dim": "#ffb59d",
                        "inverse-on-surface": "#e8f2ff",
                        "outline": "#74777e",
                        "on-secondary-fixed": "#390b00",
                        "on-tertiary-fixed": "#2a1800",
                        "surface-bright": "#f7f9ff",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#001d36"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "margin-desktop": "48px",
                        "base": "8px",
                        "margin-mobile": "16px",
                        "touch-target-min": "48px",
                        "xs": "4px",
                        "md": "16px",
                        "lg": "24px",
                        "sm": "8px",
                        "xl": "32px"
                    },
                    fontFamily: {
                        "body-md": ["Noto Sans"],
                        "headline-lg-mobile": ["Noto Sans"],
                        "title-md": ["Noto Sans"],
                        "body-lg": ["Noto Sans"],
                        "label-sm": ["Noto Sans"],
                        "headline-lg": ["Noto Sans"],
                        "label-lg": ["Noto Sans"],
                        "display-lg": ["Noto Sans"]
                    },
                    fontSize: {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    },
                    boxShadow: {
                        'level-1': '0 2px 8px -2px rgba(0, 29, 54, 0.06)'
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #001d36; /* primary */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #001d36; /* primary */
        }
        .toggle-checkbox:checked + .toggle-label .toggle-dot {
            transform: translateX(100%);
            background-color: #ffffff; /* on-primary */
        }
        
        /* Hide scrollbar for a cleaner mobile app feel */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased flex justify-center">
<!-- Mobile Container (Max 360px for strict adherence, centering on wider screens) -->
<main class="w-full max-w-[360px] min-h-screen bg-surface relative flex flex-col shadow-xl">
<!-- Task Header (Suppressed global nav for linear flow) -->
<header class="px-margin-mobile h-[64px] flex items-center justify-between bg-surface sticky top-0 z-10">
<button aria-label="Go back" class="w-touch-target-min h-touch-target-min flex items-center justify-start text-on-surface-variant -ml-sm active:opacity-70 transition-opacity min-h-[48px]">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="font-label-sm text-label-sm text-on-surface-variant flex gap-1 font-medium">
<span>Step 8 of 8</span>
</div>
</header>
<!-- Content Canvas -->
<div class="px-margin-mobile flex-1 pb-32">
<!-- Headers -->
<div class="mt-md mb-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-sm">Choose Public Info</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Selected items will appear on your public Craft Passport for buyers to see.</p>
</div>
<!-- Selection List -->
<div class="flex flex-col gap-sm">
<!-- Item 1: Artisan Name (Locked/Required Public) -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-level-1 border border-surface-variant flex items-start gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0 text-primary">
<span class="material-symbols-outlined">badge</span>
</div>
<div class="flex-1 pt-xs">
<h3 class="font-title-md text-title-md text-on-surface mb-xs">Artisan Name</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Your registered name is always visible to build trust.</p>
</div>
<div class="h-touch-target-min flex items-center shrink-0">
<span class="material-symbols-outlined text-primary icon-fill">lock</span>
</div>
</div>
<!-- Item 2: Location -->
<label class="bg-surface-container-lowest rounded-xl p-md shadow-level-1 border border-surface-variant flex items-start gap-md cursor-pointer transition-colors active:bg-surface-container">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">location_on</span>
</div>
<div class="flex-1 pt-xs">
<h3 class="font-title-md text-title-md text-on-surface mb-xs">Location</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">City and state where the craft is made.</p>
</div>
<div class="h-touch-target-min w-touch-target-min flex items-center justify-end shrink-0 relative min-w-[48px]">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 opacity-0" type="checkbox">
<div class="toggle-label block w-12 h-6 rounded-full bg-surface-variant transition-colors duration-300">
<div class="toggle-dot absolute left-1 top-1 bg-outline w-4 h-4 rounded-full transition-transform duration-300"></div>
</div>
</div>
</label>
<!-- Item 3: Material -->
<label class="bg-surface-container-lowest rounded-xl p-md shadow-level-1 border border-surface-variant flex items-start gap-md cursor-pointer transition-colors active:bg-surface-container">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">texture</span>
</div>
<div class="flex-1 pt-xs">
<h3 class="font-title-md text-title-md text-on-surface mb-xs">Material Used</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Specific details about raw materials.</p>
</div>
<div class="h-touch-target-min w-touch-target-min flex items-center justify-end shrink-0 relative min-w-[48px]">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 opacity-0" type="checkbox">
<div class="toggle-label block w-12 h-6 rounded-full bg-surface-variant transition-colors duration-300">
<div class="toggle-dot absolute left-1 top-1 bg-outline w-4 h-4 rounded-full transition-transform duration-300"></div>
</div>
</div>
</label>
<!-- Item 4: Technique -->
<label class="bg-surface-container-lowest rounded-xl p-md shadow-level-1 border border-surface-variant flex items-start gap-md cursor-pointer transition-colors active:bg-surface-container">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">handyman</span>
</div>
<div class="flex-1 pt-xs">
<h3 class="font-title-md text-title-md text-on-surface mb-xs">Crafting Technique</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Traditional methods applied to the product.</p>
</div>
<div class="h-touch-target-min w-touch-target-min flex items-center justify-end shrink-0 relative min-w-[48px]">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 opacity-0" type="checkbox">
<div class="toggle-label block w-12 h-6 rounded-full bg-surface-variant transition-colors duration-300">
<div class="toggle-dot absolute left-1 top-1 bg-outline w-4 h-4 rounded-full transition-transform duration-300"></div>
</div>
</div>
</label>
<!-- Item 5: Price (Set to Private/Off by default to show variation) -->
<label class="bg-surface-container-lowest rounded-xl p-md shadow-level-1 border border-surface-variant flex items-start gap-md cursor-pointer transition-colors active:bg-surface-container">
<div class="w-10 h-10 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">payments</span>
</div>
<div class="flex-1 pt-xs">
<h3 class="font-title-md text-title-md text-on-surface mb-xs">Base Price</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Display indicative pricing publicly. Keeping this private requires buyers to inquire directly.</p>
</div>
<div class="h-touch-target-min w-touch-target-min flex items-center justify-end shrink-0 relative min-w-[48px]">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 opacity-0" type="checkbox">
<div class="toggle-label block w-12 h-6 rounded-full bg-surface-variant transition-colors duration-300">
<div class="toggle-dot absolute left-1 top-1 bg-outline w-4 h-4 rounded-full transition-transform duration-300"></div>
</div>
</div>
</label>
<!-- Visual Indicator Help -->
<div class="flex items-center gap-xs mt-sm px-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">visibility</span>
<span class="font-label-sm text-label-sm">Switches in the 'on' position indicate public visibility.</span>
</div>
</div>
</div>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full flex justify-center z-20 pointer-events-none">
<div class="w-full max-w-[360px] bg-gradient-to-t from-surface via-surface to-transparent pt-xl pb-margin-mobile px-margin-mobile pointer-events-auto">
<button class="w-full h-touch-target-min bg-secondary text-on-secondary font-label-lg text-label-lg rounded-full flex items-center justify-center gap-sm active:scale-[0.98] transition-transform shadow-lg" style="background-color: rgb(176, 74, 33); min-height: 48px;">
                    Review Public Information
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</main>


</body></html>
