<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>KarigarSaathi - Choose Language</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "on-background": "#121c26",
                        "surface-bright": "#f7f9ff",
                        "secondary-fixed-dim": "#ffb59d",
                        "surface-tint": "#47607e",
                        "error": "#ba1a1a",

                        "surface-variant": "#d9e3f1",

                        "primary-container": "#17324d",
                        "tertiary-fixed": "#ffddb5",
                        "surface-container-highest": "#d9e3f1",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#e8f2ff",
                        "on-surface": "#121c26",
                        "primary-fixed-dim": "#afc9ea",
                        "on-tertiary-fixed-variant": "#633f00",
                        "tertiary": "#2a1800",
                        "on-primary-fixed": "#001d36",
                        "primary-fixed": "#d1e4ff",
                        "tertiary-container": "#462b00",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "outline": "#74777e",
                        "background": "#f7f9ff",
                        "on-primary-fixed-variant": "#2f4865",
                        "surface-container": "#e4effd",
                        "surface-dim": "#d1dbe9",
                        "secondary-fixed": "#ffdbd0",
                        "surface-container-high": "#dfe9f7",
                        "outline-variant": "#c3c6ce",
                        "on-tertiary-fixed": "#2a1800",
                        "on-secondary-container": "#701f00",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "secondary": "#a13f1c",
                        "secondary-container": "#fd835b",
                        "on-secondary-fixed": "#390b00",
                        "inverse-surface": "#27313c",
                        "on-tertiary-container": "#cc8c28",
                        "inverse-primary": "#afc9ea",
                        "tertiary-fixed-dim": "#ffb955",
                        "surface": "#f7f9ff",
                        "primary": "#001d36",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#819aba",
                        "surface-container-low": "#edf4ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "margin-desktop": "48px",
                        "md": "16px",
                        "touch-target-min": "48px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Noto Sans"],
                        "body-md": ["Noto Sans"],
                        "title-md": ["Noto Sans"],
                        "body-lg": ["Noto Sans"],
                        "label-sm": ["Noto Sans"],
                        "display-lg": ["Noto Sans"],
                        "label-lg": ["Noto Sans"],
                        "headline-lg": ["Noto Sans"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]

                }
            }
        }

<style>
        body { max-width: 320px; margin: 0 auto; overflow-x: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim shadow-sm w-full top-0 sticky z-50">
<div class="flex justify-between items-center px-margin-mobile h-touch-target-min w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim tracking-tight">KarigarSaathi</h1>
<button aria-label="Listen" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high transition-colors active:scale-95 duration-150 rounded-full h-[48px] w-[48px]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile pt-lg pb-32 flex flex-col gap-lg">
<div class="flex flex-col gap-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Choose Language</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Select your preferred language for the app.</p>
</div>
<div aria-label="Language selection" class="flex flex-col gap-md" role="radiogroup">
<!-- Language Card: English (Selected) -->
<label class="relative flex items-center p-md bg-[#F3E8D5] border-2 border-[#cc8c28] rounded-xl shadow-[0_4px_16px_rgba(0,29,54,0.1)] cursor-pointer active:scale-95 transition-transform">
<input checked="" class="peer sr-only" name="language" type="radio" value="en">
<div class="flex-grow flex flex-col min-w-0">
<span class="font-title-md text-title-md text-on-surface whitespace-normal">English</span>
<span class="font-label-sm text-label-sm text-on-surface-variant whitespace-normal">English</span>
</div>
<div class="flex-shrink-0 h-touch-target-min w-touch-target-min flex items-center justify-center text-[#cc8c28]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<!-- Language Card: Hindi -->
<label class="relative flex items-center p-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_2px_8px_rgba(0,29,54,0.06)] cursor-pointer active:scale-95 transition-transform hover:bg-surface-container-low">
<input class="peer sr-only" name="language" type="radio" value="hi">
<div class="flex-grow flex flex-col min-w-0">
<span class="font-title-md text-title-md text-on-surface whitespace-normal break-words leading-snug">हिन्दी</span>
<span class="font-label-sm text-label-sm text-on-surface-variant whitespace-normal">Hindi</span>
</div>
<div class="flex-shrink-0 h-touch-target-min w-touch-target-min flex items-center justify-center text-outline-variant peer-checked:text-[#cc8c28]">
<span class="material-symbols-outlined">radio_button_unchecked</span>
</div>
</label>
<!-- Language Card: Odia -->
<label class="relative flex items-center p-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_2px_8px_rgba(0,29,54,0.06)] cursor-pointer active:scale-95 transition-transform hover:bg-surface-container-low">
<input class="peer sr-only" name="language" type="radio" value="or">
<div class="flex-grow flex flex-col min-w-0">
<span class="font-title-md text-title-md text-on-surface whitespace-normal break-words leading-snug">ଓଡ଼ିଆ</span>
<span class="font-label-sm text-label-sm text-on-surface-variant whitespace-normal">Odia</span>
</div>
<div class="flex-shrink-0 h-touch-target-min w-touch-target-min flex items-center justify-center text-outline-variant peer-checked:text-[#cc8c28]">
<span class="material-symbols-outlined">radio_button_unchecked</span>
</div>
</label>
<!-- Language Card: Bengali -->
<label class="relative flex items-center p-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_2px_8px_rgba(0,29,54,0.06)] cursor-pointer active:scale-95 transition-transform hover:bg-surface-container-low">
<input class="peer sr-only" name="language" type="radio" value="bn">
<div class="flex-grow flex flex-col min-w-0">
<span class="font-title-md text-title-md text-on-surface whitespace-normal break-words leading-snug">বাংলা</span>
<span class="font-label-sm text-label-sm text-on-surface-variant whitespace-normal">Bengali</span>
</div>
<div class="flex-shrink-0 h-touch-target-min w-touch-target-min flex items-center justify-center text-outline-variant peer-checked:text-[#cc8c28]">
<span class="material-symbols-outlined">radio_button_unchecked</span>
</div>
</label>
<!-- Language Card: Telugu -->
<label class="relative flex items-center p-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_2px_8px_rgba(0,29,54,0.06)] cursor-pointer active:scale-95 transition-transform hover:bg-surface-container-low">
<input class="peer sr-only" name="language" type="radio" value="te">
<div class="flex-grow flex flex-col min-w-0">
<span class="font-title-md text-title-md text-on-surface whitespace-normal break-words leading-snug">తెలుగు</span>
<span class="font-label-sm text-label-sm text-on-surface-variant whitespace-normal">Telugu</span>
</div>
<div class="flex-shrink-0 h-touch-target-min w-touch-target-min flex items-center justify-center text-outline-variant peer-checked:text-[#cc8c28]">
<span class="material-symbols-outlined">radio_button_unchecked</span>
</div>
</label>
</div>
</main>
<!-- Fixed Bottom Actions -->
<div class="fixed bottom-0 left-0 right-0 w-full max-w-[320px] mx-auto bg-surface-container-lowest bg-opacity-90 backdrop-blur-md border-t border-surface-variant p-margin-mobile flex flex-col gap-sm z-40">
<div class="flex items-start gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] mt-0.5">info</span>
<p class="font-label-sm text-label-sm leading-tight">Provisional translations — human review required.</p>
</div>
<button class="w-full h-[48px] bg-primary-container text-on-primary font-label-lg text-label-lg font-bold rounded-full shadow-md active:scale-95 transition-transform flex items-center justify-center">
            Continue
        </button>
</div>
<!-- Script for interaction -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const radioLabels = document.querySelectorAll('label:has(input[type="radio"])');
            
            radioLabels.forEach(label => {
                const input = label.querySelector('input');
                const icon = label.querySelector('.material-symbols-outlined');
                
                input.addEventListener('change', () => {
                    // Reset all
                    radioLabels.forEach(l => {
                        l.classList.remove('bg-[#F3E8D5]', 'border-[#cc8c28]', 'border-2', 'shadow-[0_4px_16px_rgba(0,29,54,0.1)]');
                        l.classList.add('bg-surface-container-lowest', 'border-outline-variant', 'border', 'shadow-[0_2px_8px_rgba(0,29,54,0.06)]');
                        const i = l.querySelector('.material-symbols-outlined');
                        i.textContent = 'radio_button_unchecked';
                        i.classList.remove('text-[#cc8c28]');
                        i.classList.add('text-outline-variant');
                        i.style.fontVariationSettings = "'FILL' 0";
                    });

                    // Set active
                    if (input.checked) {
                        label.classList.remove('bg-surface-container-lowest', 'border-outline-variant', 'border', 'shadow-[0_2px_8px_rgba(0,29,54,0.06)]');
                        label.classList.add('bg-[#F3E8D5]', 'border-[#cc8c28]', 'border-2', 'shadow-[0_4px_16px_rgba(0,29,54,0.1)]');
                        icon.textContent = 'check_circle';
                        icon.classList.remove('text-outline-variant');
                        icon.classList.add('text-[#cc8c28]');
                        icon.style.fontVariationSettings = "'FILL' 1";
                    }
                });
            });
        });
    </script>


</body></html>
