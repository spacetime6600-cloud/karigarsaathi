<!DOCTYPE html><html class="light" lang="en"><head>

        body {
            background-color: #FFF9EF; /* Warm off-white requested in guidelines */

<body class="text-on-background font-body-md antialiased w-full h-screen flex flex-col mx-auto max-w-[360px] relative overflow-hidden bg-[#FFF9EF]" style="font-family: &quot;Noto Sans&quot;, sans-serif; background-color: rgb(255, 249, 239);">
<!-- Top Navigation Bar -->
<header class="flex justify-between items-center w-full px-margin-mobile h-[64px] bg-surface border-b-2 border-primary shrink-0 z-50 sticky top-0" style="box-shadow: 0px 2px 8px rgba(0, 29, 54, 0.06);">
<div class="flex items-center gap-xs">
<span aria-label="Back" class="material-symbols-outlined text-primary cursor-pointer hover:bg-surface-container-highest p-2 rounded-full min-h-[48px]" data-icon="arrow_back">arrow_back</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary tracking-tight">KarigarSaathi</h1>
<div class="flex items-center gap-xs">
<span aria-label="Offline status" class="material-symbols-outlined text-outline p-2 rounded-full min-h-[48px]" data-icon="wifi_off" style="font-variation-settings: &quot;FILL&quot; 1;">wifi_off</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-margin-mobile py-lg overflow-y-auto w-full max-w-[360px] mx-auto pb-24">
<!-- Status Banner -->
<div class="bg-surface rounded-xl p-md flex items-center justify-between mb-xl border border-outline-variant shadow-sm" style="box-shadow: 0px 2px 8px rgba(0, 29, 54, 0.06);">
<div class="flex items-center gap-base">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="save">save</span>
</div>
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">Saved on Device</span>
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs mt-1">
<span class="material-symbols-outlined text-outline" style="font-size: 14px;">sync_disabled</span>
                        Pending Sync
                    </span>
</div>
</div>

</div>
<!-- Graphic/Illustration area (Optional, subtle presence) -->
<div class="w-full flex justify-center mb-lg relative">
<div class="w-32 h-32 rounded-full bg-surface-container-high flex items-center justify-center relative">
<span class="material-symbols-outlined text-outline" style="font-size: 64px; font-variation-settings: 'wght' 200;">cloud_off</span>
<!-- decorative dots -->
<div class="absolute w-2 h-2 bg-secondary rounded-full top-2 right-4"></div>
<div class="absolute w-1.5 h-1.5 bg-primary-fixed rounded-full bottom-4 left-4"></div>
</div>
</div>
<!-- Main Messaging -->
<div class="text-center mb-xl">
<h2 class="font-display-lg text-display-lg text-on-surface mb-sm">No Connection</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-base font-medium">Your work is safely saved.</p>
<p class="font-body-md text-body-md text-outline">Don't worry, you can keep working offline. Changes will automatically sync when your internet connection is restored.</p>
</div>
<!-- Spacer to push actions down if needed, though scroll is preferred -->
<div class="flex-1"></div>
<!-- Actions -->
<div class="flex flex-col gap-md mt-auto w-full">
<button aria-label="Continue working offline" class="w-full min-h-[48px] bg-secondary text-on-secondary font-label-lg text-label-lg font-bold rounded-lg py-3 px-4 flex items-center justify-center gap-base transition-colors hover:bg-secondary-container focus:ring-2 focus:ring-secondary-container focus:ring-offset-2" style="background-color: rgb(176, 74, 33); min-height: 48px;">
<span class="material-symbols-outlined" data-icon="edit">edit</span>
                Continue working
            </button>
<button aria-label="Try to reconnect" class="w-full min-h-[48px] border-2 border-primary text-primary font-label-lg text-label-lg rounded-lg py-3 px-4 flex items-center justify-center gap-base transition-colors hover:bg-surface-container focus:ring-2 focus:ring-primary focus:ring-offset-2" style="color: rgb(23, 50, 77); border-color: rgb(23, 50, 77); min-height: 48px;">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                Try again
            </button>
<button aria-label="Save current state as draft" class="w-full min-h-[48px] bg-transparent text-primary font-label-lg text-label-lg rounded-lg py-3 px-4 flex items-center justify-center transition-colors hover:bg-surface-container-low focus:ring-2 focus:ring-primary focus:ring-offset-2 underline decoration-outline-variant underline-offset-4">
                Keep as Draft
            </button>
</div>
</main>
<!-- Bottom Navigation Bar (Hidden for this specific linear/transactional state per requirements, as it's a focus screen, but included in DOM if needed later) -->
<!-- Suppressed navigation shell to prioritize content canvas -->


</body></html>
