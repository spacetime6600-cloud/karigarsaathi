<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sign In - KarigarSaathi</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "page-bg": "#FFF9EF",
                "panel-bg": "#FFFFFF",
                "primary-action": "#C65A35",
                "deep-indigo": "#17324D",
                "charcoal": "#17212B",
                "outline-color": "#D1DBE9",
                "surface-hover": "#F0F4FA"
              },
              "borderRadius": {
                "panel": "16px",
                "btn": "12px",
                "input": "8px"
              },
              "spacing": {
                "margin-mobile": "16px",
                "margin-desktop": "40px",
                "container-max": "1200px"
              },
              "fontFamily": {
                "sans": ["Noto Sans", "sans-serif"]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        body {
            font-family: 'Noto Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-page-bg h-full flex flex-col text-charcoal">
<!-- Top Navigation -->
<nav class="bg-panel-bg flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop max-w-[1440px] mx-auto shadow-sm py-2">
<div class="flex items-center gap-4">
<button class="hover:bg-surface-hover p-2 rounded-full flex items-center justify-center transition-colors min-h-[48px] min-w-[48px]" onclick="history.back()">
<span class="material-symbols-outlined text-deep-indigo text-2xl">arrow_back</span>
</button>
<span class="text-[24px] font-bold text-deep-indigo">KarigarSaathi</span>
</div>
<div class="flex items-center gap-4 text-deep-indigo">
<button class="hover:bg-surface-hover p-2 rounded-btn flex items-center justify-center transition-colors min-h-[48px] min-w-[48px]">
<span class="material-symbols-outlined">language</span>
</button>
<button class="hover:bg-surface-hover px-4 py-2 rounded-btn flex items-center justify-center transition-colors border border-outline-color">
<span class="material-symbols-outlined">volume_up</span>
<span class="ml-2 font-semibold text-[16px]">Listen</span>
</button>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-[1440px] mx-auto">
<div class="w-full max-w-[480px] flex flex-col gap-8 bg-panel-bg rounded-panel shadow-lg p-6 md:p-10 relative">
<!-- Header -->
<div class="flex flex-col gap-3 pb-2">
<h1 class="text-[32px] md:text-[40px] font-bold text-deep-indigo leading-tight">Sign In</h1>
<p class="text-[16px] md:text-[18px] text-charcoal opacity-80">Enter your phone number to continue to KarigarSaathi.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault(); document.getElementById('loading').classList.remove('hidden');">
<div class="flex flex-col gap-2">
<label class="text-[16px] font-semibold text-charcoal flex items-center gap-2" for="phone">
<span class="material-symbols-outlined text-[20px]">phone_iphone</span> Phone Number
                    </label>
<div class="flex gap-3 mt-1">
<div class="border border-outline-color rounded-input bg-page-bg px-4 flex items-center justify-center text-[18px] min-h-[48px] min-w-[72px] text-deep-indigo font-medium">
                            +91
                        </div>
<input class="flex-1 border border-outline-color rounded-input bg-white px-4 min-h-[48px] text-[18px] text-deep-indigo focus:outline-none focus:ring-2 focus:ring-deep-indigo focus:border-deep-indigo transition-all" id="phone" name="phone" pattern="[0-9]{10}" placeholder="98765 43210" required="" type="tel">
</div>
<p class="text-[14px] text-charcoal opacity-70 mt-1">We will send a 6-digit verification code.</p>
</div>
<!-- Primary Action -->
<button class="w-full min-h-[48px] bg-primary-action text-white text-[18px] font-semibold rounded-btn hover:opacity-90 focus:outline-none focus:ring-4 focus:ring-primary-action/30 transition-all flex items-center justify-center gap-2 mt-4" type="submit" style="background-color: rgb(176, 74, 33);">Send Code <span class="material-symbols-outlined">arrow_forward</span></button>
</form>
<!-- Interactive Loading State (Hidden by default) -->
<div class="hidden absolute inset-0 bg-panel-bg/95 rounded-panel flex flex-col items-center justify-center z-10" id="loading">
<span class="material-symbols-outlined text-4xl animate-spin text-primary-action" style="color: rgb(176, 74, 33);">sync</span>
<span class="text-[16px] font-bold tracking-wider text-deep-indigo mt-4 uppercase">Sending Code...</span>
</div>
<!-- Footer links -->
<div class="border-t border-outline-color pt-6 flex flex-col gap-2 text-center mt-2">
<p class="text-[14px] text-charcoal opacity-80">By signing in, you agree to our</p>
<a class="text-[16px] font-semibold text-deep-indigo underline hover:text-primary-action decoration-2 underline-offset-4 transition-colors" href="#">Terms &amp; Privacy Policy</a>
</div>
</div>
</main>


</body></html>
