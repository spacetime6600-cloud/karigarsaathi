<body class="min-h-screen flex flex-col font-body-md text-on-background relative">
<!-- Subtle Background Motif -->
<div class="fixed inset-0 pointer-events-none opacity-5" style="background-image: radial-gradient(#17324d 1px, transparent 1px); background-size: 24px 24px;"></div>
<!-- TopAppBar from JSON -->
<header class="bg-surface dark:bg-surface-dim shadow-sm w-full top-0 sticky z-50">
<div class="flex justify-between items-center px-margin-desktop md:px-margin-desktop px-margin-mobile h-touch-target-min w-full max-w-[1200px] mx-auto">
<h1 class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed-dim tracking-tight">KarigarSaathi</h1>
<button class="flex items-center gap-2 text-primary hover:bg-surface-container-high transition-colors active:scale-95 duration-150 rounded-full px-4 py-2 min-h-[48px] min-w-[48px] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FFB955] focus-visible:ring-offset-2 h-touch-target-min">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
<span class="font-label-lg text-label-lg">Listen</span>
</button>
</div>
</header>
<!-- Main Workspace -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-[1200px] mx-auto z-10 relative">
<div class="w-full max-w-[600px] flex flex-col gap-lg bg-surface-container-lowest rounded-xl p-lg md:p-xl card-shadow border border-surface-variant">
<div class="text-center flex flex-col gap-2">
<h2 class="font-display-lg text-display-lg text-on-surface">Choose your language</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select your preferred language to continue.</p>
</div>
<!-- Language List -->
<div aria-label="Select Language" class="flex flex-col gap-md mt-sm" role="radiogroup">
<!-- English (Selected) -->
<button aria-checked="true" class="group flex items-center justify-between p-md rounded-xl border-[2px] bg-surface-container-lowest text-left min-h-[72px] transition-all hover:bg-surface-container-low focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FFB955] focus-visible:ring-offset-2 border-secondary" role="radio">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">English</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">English</span>
</div>
<span class="material-symbols-outlined filled text-secondary text-2xl" data-icon="check_circle" data-weight="fill">check_circle</span>
</button>
<!-- Hindi -->
<button aria-checked="false" class="group flex items-center justify-between p-md rounded-xl border-[1.5px] border-outline-variant bg-surface-container-lowest text-left min-h-[72px] transition-all hover:border-outline hover:bg-surface-container-low focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FFB955] focus-visible:ring-offset-2" role="radio">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">हिन्दी</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Hindi</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-outline text-2xl" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
<!-- Odia -->
<button aria-checked="false" class="group flex items-center justify-between p-md rounded-xl border-[1.5px] border-outline-variant bg-surface-container-lowest text-left min-h-[72px] transition-all hover:border-outline hover:bg-surface-container-low focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FFB955] focus-visible:ring-offset-2" role="radio">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">ଓଡ଼ିଆ</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Odia</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-outline text-2xl" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
<!-- Bengali -->
<button aria-checked="false" class="group flex items-center justify-between p-md rounded-xl border-[1.5px] border-outline-variant bg-surface-container-lowest text-left min-h-[72px] transition-all hover:border-outline hover:bg-surface-container-low focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FFB955] focus-visible:ring-offset-2" role="radio">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">বাংলা</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Bengali</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-outline text-2xl" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
<!-- Telugu -->
<button aria-checked="false" class="group flex items-center justify-between p-md rounded-xl border-[1.5px] border-outline-variant bg-surface-container-lowest text-left min-h-[72px] transition-all hover:border-outline hover:bg-surface-container-low focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FFB955] focus-visible:ring-offset-2" role="radio">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">తెలుగు</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Telugu</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-outline text-2xl" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
</div>
<!-- Supporting Notice -->
<div class="flex items-center justify-center gap-2 text-on-surface-variant opacity-80 mt-2">
<span class="material-symbols-outlined text-[16px]" data-icon="info">info</span>
<span class="font-label-sm text-label-sm">Provisional translations — human review required.</span>
</div>
<!-- Primary Action -->
<button class="mt-md w-full bg-secondary hover:bg-secondary-container text-on-secondary font-title-md text-title-md py-3 px-6 rounded-lg min-h-[56px] transition-colors active:scale-[0.98] duration-150 flex items-center justify-center shadow-sm">
                Continue
            </button>
</div>
</main>
<!-- Footer from JSON -->
<footer class="bg-surface-container-lowest dark:bg-surface-container-low w-full mt-auto flex flex-col items-center gap-xs py-md px-margin-mobile border-t border-surface-variant z-10 relative">
<p class="font-label-sm text-label-sm text-center text-on-surface-variant dark:text-outline font-semibold mb-2">© 2024 KarigarSaathi. Translations are provisional.</p>
<div class="flex gap-lg">
<a class="font-label-sm text-label-sm text-center text-on-surface-variant hover:text-primary transition-opacity duration-200" href="#">Terms</a>
<a class="font-label-sm text-label-sm text-center text-on-surface-variant hover:text-primary transition-opacity duration-200" href="#">Privacy</a>
</div>
</footer>
<script>
        // Simple interactivity for language selection
        const languageButtons = document.querySelectorAll('[role="radio"]');
        
        languageButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Reset all
                languageButtons.forEach(btn => {
                    btn.setAttribute('aria-checked', 'false');
                    btn.classList.remove('border-[2px]', 'border-terracotta');
                    btn.classList.add('border-[1.5px]', 'border-outline-variant');
                    
                    const icon = btn.querySelector('.material-symbols-outlined');
                    icon.textContent = 'radio_button_unchecked';
                    icon.classList.remove('filled', 'text-terracotta');
                    icon.classList.add('text-outline-variant', 'group-hover:text-outline');
                    icon.removeAttribute('data-weight');
                });

                // Set active
                button.setAttribute('aria-checked', 'true');
                button.classList.remove('border-[1.5px]', 'border-outline-variant');
                button.classList.add('border-[2px]', 'border-terracotta');
                
                const activeIcon = button.querySelector('.material-symbols-outlined');
                activeIcon.textContent = 'check_circle';
                activeIcon.classList.remove('text-outline-variant', 'group-hover:text-outline');
                activeIcon.classList.add('filled', 'text-terracotta');
                activeIcon.setAttribute('data-weight', 'fill');
            });
        });
    </script>


</body></html>
