<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sign In - KarigarSaathi</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "background": "#FFF9EF",
                      "primary": "#17324D",
                      "on-primary": "#ffffff",
                      "primary-button": "#C65A35",
                      "on-primary-button": "#ffffff",
                      "secondary": "#17212B",
                      "surface": "#ffffff",
                      "surface-variant": "#f0f0f0",
                      "outline": "#d1d5db"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "12px",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "16px",
                      "unit": "8px",
                      "gutter": "24px",
                      "container-max": "1200px",
                      "touch-target-min": "48px",
                      "margin-desktop": "40px"
              },
              "fontFamily": {
                      "body-md": ["Noto Sans", "sans-serif"],
                      "headline-lg": ["Noto Sans", "sans-serif"],
                      "label-lg": ["Noto Sans", "sans-serif"],
                      "body-lg": ["Noto Sans", "sans-serif"],
                      "headline-md": ["Noto Sans", "sans-serif"],
                      "headline-lg-mobile": ["Noto Sans", "sans-serif"],
                      "status-label": ["Noto Sans", "sans-serif"],
                      "display": ["Noto Sans", "sans-serif"]
              },
              "fontSize": {
                      "body-md": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "label-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "body-lg": ["20px", {"lineHeight": "30px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                      "status-label": ["16px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                      "display": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background h-full flex flex-col text-secondary">
<!-- Top Navigation -->
<nav class="bg-background border-b border-outline flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto h-[64px]">
<div class="flex items-center gap-2">
<button aria-label="Go back" class="material-symbols-outlined text-primary text-2xl cursor-pointer w-[48px] h-[48px] flex items-center justify-center hover:bg-surface-variant rounded-full transition-colors" onclick="history.back()">arrow_back</button>
<span class="font-headline-md text-headline-md font-bold text-primary">KarigarSaathi</span>
</div>
<div class="flex items-center gap-2 text-primary">
<button aria-label="Change language" class="hover:bg-surface-variant w-[48px] h-[48px] rounded-full flex items-center justify-center transition-colors min-h-[48px]">
<span class="material-symbols-outlined">language</span>
</button>
<button aria-label="Listen to page text" class="hover:bg-surface-variant h-[48px] rounded-full flex items-center justify-center px-4 transition-colors gap-2">
<span class="material-symbols-outlined">volume_up</span>
<span class="font-label-lg text-label-lg hidden md:inline">Listen</span>
</button>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-container-max mx-auto">
<div class="w-full max-w-md flex flex-col gap-8 bg-surface rounded-xl shadow-sm p-6 sm:p-8">
<!-- Header -->
<div class="flex flex-col gap-3 pb-6 border-b border-outline">
<h1 class="font-display text-[40px] leading-[48px] font-bold text-primary tracking-tight">Sign In</h1>
<p class="font-body-md text-body-md text-secondary opacity-90">Enter your phone number to continue to KarigarSaathi.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault(); document.getElementById('loading').classList.remove('hidden');">
<div class="flex flex-col gap-3">
<label class="font-label-lg text-label-lg text-primary flex items-center gap-2" for="phone">
<span class="material-symbols-outlined">phone_iphone</span> Phone Number
</label>
<div class="flex gap-2">
<div class="border border-outline bg-surface-variant rounded-lg px-4 flex items-center justify-center font-body-lg text-body-lg text-primary min-h-[48px]">
                            +91
                        </div>
<input class="flex-1 border border-outline rounded-lg px-4 font-body-lg text-body-lg text-primary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all min-h-[48px]" id="phone" name="phone" pattern="[0-9]{10}" placeholder="98765 43210" required="" type="tel">
</div>
<p class="font-body-md text-body-md text-secondary opacity-80 text-[16px]">We will send a 6-digit verification code.</p>
</div>
<!-- Primary Action -->
<button class="w-full h-[56px] bg-primary-button text-on-primary-button font-label-lg text-label-lg rounded-xl hover:opacity-90 focus:outline-none focus:ring-4 focus:ring-primary-button/50 transition-all flex items-center justify-center gap-2 mt-2 shadow-sm" type="submit" style="background-color: rgb(176, 74, 33);">
                    Send Code <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Interactive Loading State (Hidden by default) -->
<div class="hidden absolute inset-0 bg-surface/90 flex flex-col items-center justify-center rounded-xl z-10" id="loading">
<span class="material-symbols-outlined text-4xl animate-spin text-primary-button" style="color: rgb(176, 74, 33);">sync</span>
<span class="font-status-label text-status-label text-primary mt-4 flex items-center gap-2">SENDING CODE</span>
</div>
<!-- Footer links -->
<div class="border-t border-outline pt-6 flex flex-col gap-2 text-center mt-2">
<p class="font-body-md text-body-md text-secondary opacity-90">By signing in, you agree to our</p>
<a class="font-label-lg text-label-lg text-primary hover:text-primary-button underline decoration-2 underline-offset-4 min-h-[48px] flex items-center justify-center transition-colors" href="#">Terms &amp; Privacy Policy</a>
</div>
</div>
</main>


</body></html>
