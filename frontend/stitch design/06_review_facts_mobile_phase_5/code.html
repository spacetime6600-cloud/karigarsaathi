<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom Input Styles */
        input[type="text"], input[type="number"], select {
            border-color: #74777e;
            border-width: 1.5px;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: #001d36;
            border-width: 2px;
            box-shadow: none;
        }
        .needs-review {
            border-color: #ba1a1a;
            background-color: #ffdad6;
        }
        .needs-review:focus {
            border-color: #93000a;
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md w-full max-w-[360px] mx-auto overflow-x-hidden">
<!-- TopNav -->
<header class="bg-surface shadow-sm fixed top-0 w-full max-w-[360px] z-50 flex justify-between items-center px-margin-mobile py-base h-16">
<button aria-label="Go back" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface">KarigarSaathi</h1>
<div class="flex">
<button aria-label="Audio Help" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[24px]">settings_voice</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile pt-[80px] pb-[140px] flex flex-col gap-lg">
<!-- Header Info -->
<div class="flex flex-col gap-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider font-bold">Step 6 of 12</span>
<h2 class="font-title-md text-title-md text-primary">Review Facts</h2>
</div>
<!-- Product Image -->
<div class="rounded-xl overflow-hidden shadow-level1 bg-surface">
<img class="w-full h-48 object-cover object-center" data-alt="A beautifully crafted, handwoven textile piece featuring traditional Jamdani motifs in earthy terracotta and indigo hues. The fabric is draped elegantly over a wooden display table in a warmly lit, natural environment. Soft, diffused lighting highlights the intricate weave texture and natural fibers. The setting evokes a sense of authentic Indian craftsmanship and artisanal quality." src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg">
</div>
<!-- Uncertainty Explanation -->
<div class="bg-surface-container-low p-md rounded-lg shadow-level1 flex items-start gap-md">
<span class="material-symbols-outlined text-secondary mt-1">info</span>
<p class="font-body-md text-body-md text-on-surface">Please review the details below. Some items might need your attention before continuing.</p>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-md">
<!-- Confirmed Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="product-name">Product Name</label>
<div class="relative">
<input class="w-full h-touch-target-min rounded-[12px] bg-surface text-on-surface px-md font-body-md outline-none" id="product-name" readonly="" type="text" value="Handwoven Cotton Saree">
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-primary-container">check_circle</span>
</div>
</div>
<!-- Focus State Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="material">Material <span class="text-error">*</span></label>
<input autofocus="" class="w-full h-touch-target-min rounded-[12px] bg-surface text-on-surface px-md font-body-md outline-none border-[2px] border-primary" id="material" type="text" value="Pure Cotton">
</div>
<!-- Needs Review Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-lg text-label-lg text-on-surface" for="price">Price (INR)</label>
<span class="flex items-center gap-xs text-error font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[16px]">error_outline</span>
                        Check this
                    </span>
</div>
<input class="needs-review w-full h-touch-target-min rounded-[12px] text-on-surface px-md font-body-md outline-none border-2" id="price" type="number" value="0">
</div>
<!-- Confirmed Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="technique">Weaving Technique</label>
<div class="relative">
<input class="w-full h-touch-target-min rounded-[12px] bg-surface text-on-surface px-md font-body-md outline-none" id="technique" readonly="" type="text" value="Jamdani">
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-primary-container">check_circle</span>
</div>
</div>
</form>
</main>
<!-- Footer Actions (Fixed Bottom) -->
<footer class="fixed bottom-0 w-full max-w-[360px] bg-surface border-t border-outline-variant p-margin-mobile flex flex-col gap-sm shadow-[0_-2px_8px_rgba(0,0,0,0.05)] z-40">
<button class="w-full h-touch-target-min bg-primary-container text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center font-bold">Check and Correct</button>
<button class="w-full h-touch-target-min bg-transparent text-primary font-label-lg text-label-lg rounded-full border-2 border-primary flex items-center justify-center">
            Continue as Draft
        </button>
</footer>


</body></html>
