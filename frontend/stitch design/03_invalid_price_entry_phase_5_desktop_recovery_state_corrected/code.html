<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Invalid Price Entry - KarigarSaathi</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                      "primary": "#000000",
                      "secondary-fixed": "#d9e3f4",
                      "on-error-container": "#93000a",
                      "on-primary-container": "#7d8497",
                      "primary-container": "#141b2b",
                      "on-secondary-container": "#596372",
                      "on-primary": "#ffffff",
                      "surface": "#f6f9ff",
                      "inverse-primary": "#c0c6db",
                      "background": "#f6f9ff",
                      "surface-bright": "#f6f9ff",
                      "on-tertiary-fixed-variant": "#55442d",
                      "tertiary-fixed-dim": "#dcc2a4",

                      "on-secondary-fixed-variant": "#3e4755",
                      "surface-container-high": "#e5e8ee",
                      "surface-container": "#eaeef4",
                      "tertiary": "#000000",
                      "on-surface-variant": "#45464c",
                      "on-error": "#ffffff",
                      "on-tertiary-container": "#968065",
                      "outline": "#76777d",
                      "on-background": "#171c20",
                      "primary-fixed-dim": "#c0c6db",
                      "error-container": "#ffdad6",
                      "primary-fixed": "#dce2f7",
                      "surface-variant": "#dfe3e9",
                      "surface-container-low": "#f0f4fa"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "24px",
                      "touch-target-min": "48px",
                      "unit": "8px",
                      "margin-mobile": "16px",
                      "margin-desktop": "40px",
                      "container-max": "1200px"
              },
              "fontFamily": {
                      "headline-md": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "status-label": ["Inter"],
                      "label-lg": ["Inter"],

                      "display": ["Inter"],

              "fontSize": {

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased" style="font-family: 'Noto Sans', sans-serif;">
<!-- TopNavBar (Translational/Task Focused, nav suppressed, header retained for brand/actions) -->
<header class="bg-surface border-b-2 border-primary flat no shadows flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto h-[64px]">
<div class="flex items-center gap-unit">
<button aria-label="Back" class="p-2 text-secondary hover:bg-surface-container-highest transition-colors rounded min-h-touch-target-min">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
<span class="sr-only">Back</span>
</button>
<span class="font-headline-md text-headline-md font-bold text-primary">KarigarSaathi</span>
</div>
<div class="flex items-center gap-unit">
<button aria-label="Language" class="p-2 text-secondary hover:bg-surface-container-highest transition-colors rounded flex items-center gap-1">
<span class="material-symbols-outlined" data-icon="language">language</span>
</button>
<button aria-label="Listen" class="p-2 text-secondary hover:bg-surface-container-highest transition-colors rounded flex items-center gap-1">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
</button>
</div>
</header>
<main class="flex-grow flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-12 max-w-3xl mx-auto w-full">
<div class="mb-8">
<div class="inline-block border border-secondary px-2 py-1 mb-4">
<span class="font-status-label text-status-label uppercase text-secondary tracking-widest">Step 07 of 12</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">Enter a valid price.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant border-l-4 border-outline pl-4 py-1">The price must be a number greater than zero. Your cost details are still saved.</p>
</div>
<div class="bg-surface-container border-2 border-primary p-6 md:p-8 mb-8 relative group">
<div class="absolute -top-4 -right-4 bg-error-container text-on-error-container border border-error px-3 py-1 z-10 flex items-center gap-2 rounded">
<span class="material-symbols-outlined text-error" data-icon="warning" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-label-lg text-label-lg text-primary">Invalid Entry</span>
</div>
<form class="space-y-6">
<div>
<label class="block font-label-lg text-label-lg text-primary mb-2" for="product_price">Product: SAMPLE PRODUCT<br>Price (INR)</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-secondary">
                            ₹
                        </span>
<input aria-describedby="price-error" aria-invalid="true" class="w-full bg-surface-container-lowest border-2 border-error text-error font-body-lg text-body-lg pl-10 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-error rounded transition-all" id="product_price" name="product_price" type="text" value="-5">
<span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
<span class="material-symbols-outlined text-error" data-icon="error">error</span>
</span>
</div>
<p class="mt-2 font-body-md text-body-md text-primary font-bold flex items-center gap-1" id="price-error"><span aria-hidden="true" class="material-symbols-outlined text-error">error</span> <span class="text-error">Please enter a whole number or two decimal places (e.g., 500 or 500.50). Value "-5" is invalid.</span></p>
</div>
<div>
<label class="block font-label-lg text-label-lg text-primary mb-2" for="product_notes">Cost Details (Saved)</label>
<textarea class="w-full bg-surface-variant border-2 border-outline-variant text-on-surface-variant font-body-md text-body-md p-3 opacity-70 cursor-not-allowed" disabled="" id="product_notes" name="product_notes" readonly="" rows="3">Cost details: Saved</textarea>
</div>
</form>
</div>
<div class="flex flex-col md:flex-row gap-4 mt-auto md:mt-8 pt-8 border-t-2 border-outline-variant">
<button class="order-1 md:order-2 flex-1 bg-primary-container text-on-primary font-label-lg text-label-lg min-h-[48px] px-6 py-3 flex items-center justify-center gap-2 hover:bg-inverse-surface focus:outline-none focus:ring-4 focus:ring-black focus:ring-offset-4 ring-offset-background transition-all group opacity-50 cursor-not-allowed" disabled="true" type="button" style="background-color: rgb(23, 50, 77);">Correct price <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span></button>
<div class="order-2 md:order-1 flex flex-col md:flex-row gap-4 flex-1">
<button class="w-full md:w-auto bg-surface-container-lowest border-2 border-primary text-primary font-label-lg text-label-lg min-h-[56px] px-6 py-3 flex items-center justify-center hover:bg-surface-container focus:outline-none focus:ring-4 focus:ring-black focus:ring-offset-4 ring-offset-background transition-all min-h-touch-target-min" type="button">
                    Keep as Draft
                </button>
<button class="w-full md:w-auto bg-surface border-2 border-transparent hover:border-primary text-secondary font-label-lg text-label-lg min-h-[56px] px-6 py-3 flex items-center justify-center focus:outline-none focus:ring-4 focus:ring-black focus:ring-offset-4 ring-offset-background transition-all min-h-touch-target-min" type="button">
                    Cancel
                </button>
</div>
</div>
</main>


</body></html>
