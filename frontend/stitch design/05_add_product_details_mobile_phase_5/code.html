<body class="bg-background text-on-background min-h-screen flex flex-col w-[360px] mx-auto md:w-full overflow-x-hidden">
<!-- Top App Bar -->
<header class="bg-surface top-0 sticky border-b-2 border-primary flat no shadows flex justify-between items-center px-margin-mobile h-touch-target-min w-full max-w-container-max mx-auto z-10">
<button aria-label="Go back" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary text-center flex-grow">KarigarSaathi</h1>
<button aria-label="Listen" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile pt-lg pb-32 flex flex-col gap-lg">
<!-- Header Section -->
<div class="flex flex-col gap-xs">
<p class="font-label-sm text-label-sm text-on-surface-variant">Step 5 of 12</p>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Describe Your Item</h2>
</div>
<!-- Voice Panel Canvas (Level 1 Surface) -->
<div class="bg-surface-container rounded-xl p-lg flex flex-col items-center justify-center gap-lg shadow-sm border border-outline-variant/30 flex-grow min-h-[300px]">
<div class="flex flex-col items-center gap-xs">
<p class="font-title-md text-title-md text-on-surface">Start speaking</p>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px] text-[#2e7d32]" data-icon="mic_double">mic</span>
<span class="font-label-sm text-label-sm text-[#2e7d32]">Microphone is Ready</span>
</div>
</div>
<!-- Central Microphone Button -->
<button aria-label="Tap to speak" class="w-32 h-32 rounded-full bg-[#fbe9e7] text-primary flex items-center justify-center shadow-md active:scale-95 transition-transform" style="color: rgb(176, 74, 33);">
<span class="material-symbols-outlined text-[48px]" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Manual Fallback -->
<button class="flex items-center justify-center gap-base w-full h-touch-target-min text-primary font-label-lg text-label-lg active:bg-surface-variant rounded-lg transition-colors font-body-md">
<span class="material-symbols-outlined" data-icon="keyboard">keyboard</span>
            Enter details manually
        </button>
</main>
<!-- Fixed Footer -->
<footer class="fixed bottom-0 w-[360px] md:w-full bg-surface border-t border-outline-variant/30 p-margin-mobile flex flex-col gap-base z-50">
<div class="flex justify-center items-center gap-xs mb-xs">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant" data-icon="cloud_done">cloud_done</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Saved on device</span>
</div>
<button class="w-full h-touch-target-min bg-primary text-on-primary font-label-lg text-label-lg rounded-lg font-bold flex items-center justify-center shadow-md active:bg-[#a34b2c] transition-colors" style="background-color: rgb(176, 74, 33); font-family: &quot;Noto Sans&quot;, sans-serif;">
            Next Step
        </button>
<button class="w-full h-touch-target-min bg-transparent text-[#1a237e] border-2 border-[#1a237e] font-label-lg text-label-lg rounded-lg flex items-center justify-center active:bg-[#e8eaf6] transition-colors" style="border-color: rgb(23, 50, 77); color: rgb(23, 50, 77); font-family: &quot;Noto Sans&quot;, sans-serif;">
            Continue as Draft
        </button>
</footer>
